[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-listing"
version = "0.1.0"
description = "Binance spot listing-state event ingestor for duckport-rs"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=15.0",
    "python-dotenv>=1.0",
    "duckdb==1.5.6",
]

[tool.setuptools.packages.find]
include = ["binance_listing*"]

[project.scripts]
binance-listing = "binance_listing.main:main"
loadhist = "binance_listing.loadhist:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
